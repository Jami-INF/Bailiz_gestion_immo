<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22524E" />
    <!--
      L'application n'a rien à faire dans un index de recherche : rendue en
      JavaScript, son seul contenu visible d'un robot est un tableau de bord
      vide. Elle concurrencerait la vitrine (bailiz.fr) sur les requêtes de
      marque en offrant une bien plus mauvaise première visite.
      `follow` est conservé : les liens sortants restent suivis.
      Cf. docs/CDC-site-vitrine-seo.md §8.
    -->
    <meta name="robots" content="noindex,follow" />
    <title>Bailiz - Baux et états des lieux</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
